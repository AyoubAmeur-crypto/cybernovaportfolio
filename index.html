    <!-- Automatic Domain-Aware Canonical, Open Graph URL, & JSON-LD URL Hydrator -->
    <script>
      (function () {
        try {
          var origin = window.location.origin;
          var canonicalUrl = origin + '/';

          var canonical = document.createElement('link');
          canonical.rel = 'canonical';
          canonical.href = canonicalUrl;
          document.head.appendChild(canonical);

          var ogUrl = document.createElement('meta');
          ogUrl.setAttribute('property', 'og:url');
          ogUrl.content = canonicalUrl;
          document.head.appendChild(ogUrl);

          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && ogImg.getAttribute('content').charAt(0) === '/') {
            ogImg.setAttribute('content', origin + ogImg.getAttribute('content'));
          }

          var ldScript = document.getElementById('salma-jsonld');
          if (ldScript && ldScript.textContent) {
            var data = JSON.parse(ldScript.textContent);
            if (data['@graph']) {
              data['@graph'].forEach(function (node) {
                if (
                  node['@type'] === 'ProfilePage' ||
                  node['@type'] === 'Person' ||
                  node['@type'] === 'WebSite'
                ) {
                  node.url = canonicalUrl;
                }
              });
              ldScript.textContent = JSON.stringify(data);
            }
          }
        } catch (_) {}
      })();
    </script>
